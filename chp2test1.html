<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Background Website</title>
  <style>


    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto;
      background: url('imag to website-05.jpg') no-repeat top center;
      background-size: cover;
    }

    .triangle {
      position: absolute;
      /* Position: 1/6 from left edge */
      left: 16.66%;
      top: 82.55%;

      /* Triangle dimensions: width twice the height */
      width: 0;
      height: 0;
      border-top: 3vh solid transparent;   /* 高度隨螢幕高度 */
      border-bottom: 3vh solid transparent;
      border-left: 2vw solid white;        /* 寬度隨螢幕寬度 */
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Audio element -->
  <audio id="audioPlayer" src="https://raw.githubusercontent.com/mwymaisy/repo/branch/05_birds.mp3"></audio>

  <!-- Clickable triangle overlay -->
  <div class="triangle" onclick="document.getElementById('audioPlayer').play()"></div>
</body>
</html>
